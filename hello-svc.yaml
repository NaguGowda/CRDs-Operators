apiVersion: v1
kind: Service
metadata:
  name: hello-service
spec:
  type: ClusterIP  # Change to LoadBalancer if you are on cloud (AWS, GKE, Azure) and want a public IP
  selector:
    app: hello-app
  ports:
    - protocol: TCP
      port: 80        # The port the service exposes
      targetPort: 8080 # The port the container is listening on
